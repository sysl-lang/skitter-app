# ─────────────────────────────────────────────────────────────────────────────
#  Your application. These two lines are the whole of what a new project edits.
# ─────────────────────────────────────────────────────────────────────────────

# The identity Android knows your application by: the row in the app drawer, the directory it is
# installed into, and the name the Play Store would list it under. It must contain a dot and it is
# permanent — changing it after anyone has installed the app makes a second, unrelated app.
skitter.applicationId=com.example.myapp

# What appears under the icon and in the title bar. Any text at all; it is never a symbol.
skitter.appName=My App

# ─────────────────────────────────────────────────────────────────────────────
#  And one line you only need if you want more of SDL than SDL3 itself.
# ─────────────────────────────────────────────────────────────────────────────

# Extra SDL libraries, space separated: `ttf`, `image`, `mixer`. Leave it empty and you get SDL3 on
# its own, which draws, takes input and plays nothing.
#
#     skitter.sdlLibraries=ttf image
#
# **Each one is a separate AAR and a separate sysl package**, and it is worth knowing why rather than
# wondering: a link directive is never pruned, so folding them together would put `-lSDL3_ttf` on the
# link line of a program that only draws rectangles. Naming one here makes `./fetch-sdl3.sh`
# download it and the CMake find it, link it and hand its headers to sysl — and you then add the
# matching package to `program/package.hocon`:
#
#     ttf    -> sdl3-ttf    { git = "github.com/sysl-lang/sdl3-ttf",   version = "0.3.0" }
#     image  -> sdl3-image  { git = "github.com/sysl-lang/sdl3-image", version = "0.1.0" }
#     mixer  -> sdl3-mixer  { git = "github.com/sysl-lang/sdl3-mixer", version = "0.3.1" }
#
# Re-run `./fetch-sdl3.sh` after changing this line.
skitter.sdlLibraries=

# ─────────────────────────────────────────────────────────────────────────────
#  Below here is Gradle's own configuration and is not about your application.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
