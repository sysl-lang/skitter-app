# ─────────────────────────────────────────────────────────────────────────────
#  Your application. These two lines are the whole of what a new project edits.
# ─────────────────────────────────────────────────────────────────────────────

# The identity Android knows your application by: the row in the app drawer, the directory it is
# installed into, and the name the Play Store would list it under. It must contain a dot and it is
# permanent — changing it after anyone has installed the app makes a second, unrelated app.
skitter.applicationId=com.example.myapp

# What appears under the icon and in the title bar. Any text at all; it is never a symbol.
skitter.appName=My App

# ─────────────────────────────────────────────────────────────────────────────
#  And one line, or two, if you want an icon of your own.
# ─────────────────────────────────────────────────────────────────────────────

# The launcher icon: a path, from this directory, to ONE square PNG — 1024×1024 is the size to draw
# it at, and anything smaller than 432×432 or not square stops the build with a message. Leave it
# empty and Android shows its generic icon.
#
#     skitter.icon=icon.png
#
# **Keep the logo's important part inside the middle two thirds.** The build makes every size Android
# asks for, including the adaptive icon, which a launcher crops to a circle, a squircle or a teardrop
# as it likes — so the picture is scaled into the middle 66 of 108 units, the part every shape keeps,
# and laid over the background colour below. A logo on a transparent background works best: its
# outline is also what Android 13's themed icons draw, tinted to the wallpaper.
skitter.icon=

# The colour behind the logo in the adaptive icon, as #RRGGBB. Leave it empty for white.
skitter.iconBackground=

# ─────────────────────────────────────────────────────────────────────────────
#  And one line you only need if you want more of SDL than SDL3 itself.
# ─────────────────────────────────────────────────────────────────────────────

# Extra SDL libraries, space separated: `ttf`, `image`, `mixer`. Leave it empty and you get SDL3 on
# its own, which draws, takes input and plays nothing.
#
#     skitter.sdlLibraries=ttf image
#
# **Each one is a separate AAR and a separate sysl package**, and it is worth knowing why rather than
# wondering: a link directive is never pruned, so folding them together would put `-lSDL3_ttf` on the
# link line of a program that only draws rectangles. Naming one here makes `./fetch-sdl3.sh`
# download it and the CMake find it, link it and hand its headers to sysl — and you then add the
# matching package to `program/package.hocon`:
#
#     ttf    -> sdl3-ttf    { git = "github.com/sysl-lang/sdl3-ttf",   version = "0.3.0" }
#     image  -> sdl3-image  { git = "github.com/sysl-lang/sdl3-image", version = "0.1.0" }
#     mixer  -> sdl3-mixer  { git = "github.com/sysl-lang/sdl3-mixer", version = "0.3.1" }
#
# Re-run `./fetch-sdl3.sh` after changing this line.
skitter.sdlLibraries=

# ─────────────────────────────────────────────────────────────────────────────
#  And one line you only need if your program reaches past the screen.
# ─────────────────────────────────────────────────────────────────────────────

# What the app may use, space separated. Leave it empty and it asks for nothing beyond vibration,
# which SDL's rumble needs and which Android grants without a word to the user.
#
#     skitter.permissions=microphone
#
#     microphone  -> RECORD_AUDIO          a tuner, a recorder, voice input
#     camera      -> CAMERA
#     internet    -> INTERNET              any socket at all, a local network included
#     bluetooth   -> BLUETOOTH_CONNECT, and BLUETOOTH up to Android 11, where it was split
#     vibrate     -> VIBRATE               already granted; accepted so the line can say it
#
# Anything else is written as Android spells it — `android.permission.WAKE_LOCK` — and passed
# through; an unknown short name stops the build and lists these. **Nothing in the manifest
# changes**: the build merges the lines in, the way it merges a library's.
#
# **`microphone` and `camera` are also asked for while the app runs**, since Android grants a
# dangerous permission only when the person says yes. SDL asks by itself when the program opens a
# recording device or a camera, so there is nothing to write for it — but the program must cope with
# the answer being no, which reaches it as the device failing to open. `bluetooth` is a runtime
# permission too from Android 12; `SDL_RequestAndroidPermission` is the call that asks for it.
skitter.permissions=

# ─────────────────────────────────────────────────────────────────────────────
#  And one line for an app that is looked at more than it is touched.
# ─────────────────────────────────────────────────────────────────────────────

# `true` keeps the screen on while the app is in front — a tuner, a recipe, a scoreboard. `false`
# lets it sleep on the phone's own timeout, as any other app does. The program can change its mind
# while it runs with `sh.sysl.skitter.keep_awake`; this is only where it starts.
skitter.keepAwake=false

# ─────────────────────────────────────────────────────────────────────────────
#  Below here is Gradle's own configuration and is not about your application.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
